[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritest"
version = "0.1.0"
description = "Verifiable test-data analysis agent: every claim in the report is traceable to reproducible evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
llm = ["httpx>=0.25"]
tdms = ["nptdms>=1.7"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7", "httpx>=0.25", "nptdms>=1.7"]
all = ["httpx>=0.25", "nptdms>=1.7", "mcp>=1.0"]

[project.scripts]
veritest = "veritest.cli:main"
veritest-mcp = "veritest.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
