[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groundline"
version = "0.1.1"
description = "Verifiable AI agent for engine test data: every number in the report traces back to a reproducible computation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "llm", "agent", "verification", "hallucination", "test-data", "rocket-engine"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "mcp>=1.0,<3",  # core dep so `uvx groundline mcp` works; the server runs on both 1.x and 2.x
]

[project.urls]
Homepage = "https://github.com/fhs1220888/Groundline"
Repository = "https://github.com/fhs1220888/Groundline"

[project.optional-dependencies]
llm = ["httpx>=0.25"]
tdms = ["nptdms>=1.7"]
mcp = ["mcp>=1.0,<3"]
dev = ["pytest>=7", "httpx>=0.25", "nptdms>=1.7"]
all = ["httpx>=0.25", "nptdms>=1.7", "mcp>=1.0,<3"]

[project.scripts]
groundline = "groundline.cli:main"
groundline-mcp = "groundline.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B"]
ignore = ["B008", "B905"]  # defaults bind loop values on purpose; zip(strict=) is noise for same-length arrays

[tool.pytest.ini_options]
testpaths = ["tests"]
