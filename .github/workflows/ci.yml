name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests docs/demo

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q  # includes the web demo's JS verifier parity check (node is preinstalled on the runner)
      - run: groundline demo --out /tmp/demo && groundline reproduce /tmp/demo/report.json
      # the default install resolves mcp 2.x; keep the 1.x lower bound working too
      - if: matrix.python == '3.10'
        run: pip install "mcp>=1.0,<2" && pytest -q -k mcp
